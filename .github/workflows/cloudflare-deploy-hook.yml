name: Cloudflare Deploy Hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  trigger-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate deploy hook secret
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

      - name: Trigger Cloudflare production build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            "$DEPLOY_HOOK_URL"
          echo "Cloudflare deploy hook accepted."
